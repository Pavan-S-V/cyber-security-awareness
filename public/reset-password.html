
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CyberSafe</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <main style="max-width:440px;margin:80px auto;padding:30px;background:white;border-radius:20px;">
        <h1>Reset your password</h1>
        <p>Enter a new password for your CyberSafe account.</p>

        <form id="resetForm">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" minlength="8"
                   autocomplete="new-password" required
                   style="display:block;width:100%;box-sizing:border-box;padding:14px;margin:12px 0 20px;">

            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" minlength="8"
                   autocomplete="new-password" required
                   style="display:block;width:100%;box-sizing:border-box;padding:14px;margin:12px 0 20px;">

            <p id="resetMessage" role="status"></p>

            <button type="submit" style="padding:14px 20px;background:#2864ff;color:white;border:0;border-radius:10px;cursor:pointer;">
                Save New Password
            </button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/auth.js"></script>
    <script>
    const client = window.supabaseClient || supabaseClient;
    const form = document.getElementById("resetForm");
    const message = document.getElementById("resetMessage");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            message.textContent = "Use at least 8 characters.";
            return;
        }

        if (password !== confirm) {
            message.textContent = "The passwords do not match.";
            return;
        }

        const { data } = await client.auth.getSession();

        if (!data.session) {
            message.textContent = "Your reset link is invalid or expired. Request a new one.";
            return;
        }

        const { error } = await client.auth.updateUser({ password });

        if (error) {
            message.textContent = error.message;
            return;
        }

        message.textContent = "Password updated! You can now sign in with your new password.";

        setTimeout(() => {
            window.location.replace("/login.html");
        }, 1500);
    });
    </script>
</body>
</html>
