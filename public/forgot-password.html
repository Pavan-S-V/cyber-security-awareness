<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7ff">
    <title>Password Recovery | CyberSafe</title>

    <link rel="stylesheet" href="CSS/login.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 36px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #172746;
            background:
                radial-gradient(circle at 10% 15%, #dbe7ff 0, transparent 32%),
                radial-gradient(circle at 90% 85%, #e9e3ff 0, transparent 34%),
                linear-gradient(135deg, #f8faff, #eef3ff);
        }

        button, input {
            font: inherit;
        }

        .recovery-card {
            width: 100%;
            max-width: 490px;
            padding: 38px;
            border: 1px solid rgba(210, 222, 247, .9);
            border-radius: 26px;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 24px 80px rgba(36, 66, 130, .13);
            animation: cardEnter .45s ease both;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(135deg, #2764ff, #7850ff);
            box-shadow: 0 8px 20px rgba(74, 86, 255, .25);
        }

        .brand-icon svg {
            width: 25px;
            height: 25px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -.6px;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: #8491a9;
            font-size: 12px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 12px;
            padding: 7px 11px;
            border: 1px solid #e0e8ff;
            border-radius: 30px;
            color: #365eea;
            background: #f3f6ff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .eyebrow-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4d72ff;
        }

        h1 {
            margin: 0 0 12px;
            color: #152b50;
            font-size: clamp(27px, 5vw, 34px);
            font-weight: 800;
            letter-spacing: -1.2px;
            line-height: 1.2;
        }

        .description {
            margin: 0 0 28px;
            color: #77849c;
            font-size: 14px;
            line-height: 1.8;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;
            color: #253653;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrap {
            position: relative;
        }

        .field input {
            display: block;
            width: 100%;
            height: 53px;
            padding: 0 15px;
            outline: none;
            border: 1.5px solid #dfe6f2;
            border-radius: 13px;
            color: #172746;
            background: #fbfcff;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .field input::placeholder {
            color: #a0abc0;
        }

        .field input:focus {
            border-color: #5574ff;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(85, 116, 255, .11);
        }

        .password-input {
            padding-right: 53px !important;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 9px;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            transform: translateY(-50%);
            border: 0;
            border-radius: 9px;
            color: #73819b;
            background: transparent;
            cursor: pointer;
            transition: color .2s, background .2s;
        }

        .toggle-password:hover {
            color: #315bff;
            background: #eef2ff;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .primary-button {
            position: relative;
            width: 100%;
            min-height: 53px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 8px;
            padding: 14px 18px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(105deg, #2865ff, #704bff);
            box-shadow: 0 9px 20px rgba(69, 83, 245, .22);
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, opacity .2s;
        }

        .primary-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 13px 26px rgba(69, 83, 245, .30);
        }

        .primary-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .primary-button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            color: #4d64c8;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            color: #254bff;
        }

        .recovery-card a:focus-visible,
        .primary-button:focus-visible,
        .toggle-password:focus-visible {
            outline: 3px solid #a7b9ff;
            outline-offset: 3px;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px 14px;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.visible {
            display: block;
            animation: cardEnter .2s ease both;
        }

        .message.success {
            border-color: #c6f0dc;
            color: #14744d;
            background: #effcf5;
        }

        .message.error {
            border-color: #ffd6d6;
            color: #b42332;
            background: #fff5f5;
        }

        .security-note {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid #edf0f7;
            color: #8290a7;
            font-size: 11px;
            line-height: 1.7;
        }

        .security-note svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #5575e9;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 520px) {
            body {
                padding: 18px 12px;
            }

            .recovery-card {
                padding: 26px 21px;
                border-radius: 21px;
            }

            .brand {
                margin-bottom: 27px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="recovery-card">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">CyberSafe</div>
                <div class="brand-subtitle">Your security, our priority</div>
            </div>
        </div>

        <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            Account security
        </div>

        <h1 id="recoveryTitle">Forgot password?</h1>
        <p class="description" id="recoveryDescription">
            No worries. Enter your registered email to begin securely
            recovering your account.
        </p>

        <form id="emailForm">
            <div class="field">
                <label for="recoveryEmail">Email address</label>
                <input
                    id="recoveryEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>
            <button class="primary-button" type="submit">
                Send verification code
                <span aria-hidden="true">→</span>
            </button>
        </form>

        <form id="otpForm" hidden>
            <div class="field">
                <label for="recoveryOtp">6-digit verification code</label>
                <input
                    id="recoveryOtp"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="Enter your 6-digit OTP"
                    required
                >
            </div>
            <button class="primary-button" type="submit">
                Verify code <span aria-hidden="true">→</span>
            </button>
        </form>

        <form id="newPasswordForm" hidden>
            <div class="field">
                <label for="newPassword">New password</label>
                <div class="input-wrap">
                    <input
                        id="newPassword"
                        class="password-input"
                        type="password"
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="At least 8 characters"
                        required
                    >
                    <button class="toggle-password" type="button"
                            data-target="newPassword"
                            aria-label="Show new password"
                            aria-pressed="false">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            width="20" height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <div class="input-wrap">
                    <input
                        id="confirmPassword"
                        class="password-input"
                        type="password"
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="Enter password again"
                        required
                    >
                    <button class="toggle-password" type="button"
                            data-target="confirmPassword"
                            aria-label="Show confirm password"
                            aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button class="primary-button" type="submit">
                Save new password <span aria-hidden="true">→</span>
            </button>
        </form>

        <div id="recoveryMessage" class="message"
             role="status" aria-live="polite"></div>

        <a class="back-link" href="login.html">
            <span aria-hidden="true">←</span> Back to Sign In
        </a>

        <div class="security-note">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                <path d="M12 14v3"/>
            </svg>
            <span>
                Your account security matters. Never share your verification
                code or password with anyone.
            </span>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/auth.js"></script>

    <script>
    (() => {
        const client = window.supabaseClient || (
            typeof supabaseClient !== "undefined" ? supabaseClient : null
        );

        const $ = id => document.getElementById(id);

        const emailForm = $("emailForm");
        const otpForm = $("otpForm");
        const passwordForm = $("newPasswordForm");
        const message = $("recoveryMessage");

        let email = "";

        function showMessage(text, type = "success") {
            message.textContent = text;
            message.className = "message visible " + type;
        }

        function showStep(step) {
            emailForm.hidden = step !== "email";
            otpForm.hidden = step !== "otp";
            passwordForm.hidden = step !== "password";

            const headings = {
                email: [
                    "Forgot password?",
                    "No worries. Enter your registered email to begin securely recovering your account."
                ],
                otp: [
                    "Check your email",
                    "Enter the 6-digit recovery code sent to your registered email address."
                ],
                password: [
                    "Create a new password",
                    "Choose a strong new password to secure your CyberSafe account."
                ]
            };

            $("recoveryTitle").textContent = headings[step][0];
            $("recoveryDescription").textContent = headings[step][1];
        }

        function setLoading(form, loading, normalText) {
            const button = form.querySelector("button[type='submit']");
            button.disabled = loading;
            button.textContent = loading ? "Please wait..." : normalText;
        }

        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", () => {
                const input = $(button.dataset.target);
                const showing = input.type === "text";

                input.type = showing ? "password" : "text";
                button.setAttribute(
                    "aria-label",
                    showing ? "Show password" : "Hide password"
                );
                button.setAttribute("aria-pressed", String(!showing));

                button.innerHTML = showing
                    ? `<svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                       </svg>`
                    : `<svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M3 3l18 18"/>
                            <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.9 14.9 0 0 1-3.1 3.8"/>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.3 0 2.5-.3 3.5-.8"/>
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                       </svg>`;
            });
        });

        if (!client) {
            showMessage(
                "Supabase could not be initialized. Check JS/auth.js.",
                "error"
            );
            return;
        }

        emailForm.addEventListener("submit", async event => {
            event.preventDefault();

            email = $("recoveryEmail").value.trim();
            setLoading(emailForm, true, "Send verification code");

            try {
                const { error } =
                    await client.auth.resetPasswordForEmail(email);

                if (error) throw error;

                showStep("otp");
                $("recoveryOtp").focus();

                showMessage(
                    "Recovery request submitted. Check your inbox and spam folder."
                );
            } catch (error) {
                showMessage(
                    error.message || "Could not request a recovery code.",
                    "error"
                );
            } finally {
                setLoading(emailForm, false, "Send verification code");
            }
        });

        otpForm.addEventListener("submit", async event => {
            event.preventDefault();

            const token = $("recoveryOtp").value.trim();

            if (!/^\d{6}$/.test(token)) {
                showMessage("Enter the complete 6-digit OTP.", "error");
                return;
            }

            setLoading(otpForm, true, "Verify code");

            try {
                const { error } = await client.auth.verifyOtp({
                    email,
                    token,
                    type: "recovery"
                });

                if (error) throw error;

                showStep("password");
                $("newPassword").focus();
                showMessage("Email verified. You can now set a new password.");
            } catch (error) {
                showMessage(
                    error.message || "Invalid or expired verification code.",
                    "error"
                );
            } finally {
                setLoading(otpForm, false, "Verify code");
            }
        });

        passwordForm.addEventListener("submit", async event => {
            event.preventDefault();

            const password = $("newPassword").value;
            const confirm = $("confirmPassword").value;

            if (password.length < 8) {
                showMessage(
                    "Your password must contain at least 8 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirm) {
                showMessage("Both passwords must match.", "error");
                return;
            }

            setLoading(passwordForm, true, "Save new password");

            try {
                const { error } = await client.auth.updateUser({ password });

                if (error) throw error;

                showMessage(
                    "Password changed successfully. Redirecting to Sign In..."
                );

                await client.auth.signOut();

                setTimeout(() => {
                    window.location.replace("/login.html");
                }, 1500);
            } catch (error) {
                showMessage(
                    error.message || "Could not update your password.",
                    "error"
                );
            } finally {
                setLoading(passwordForm, false, "Save new password");
            }
        });

        showStep("email");
    })();
    </script>
</body>
</html>
